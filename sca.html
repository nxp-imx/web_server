<!DOCTYPE html>
<html>

<head>
    <meta charset='UTF-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1,maximum-scale=1,user-scalable=no">
    <script src="./lib/jquery-3.7.0.js"></script>
    <script src="./lib/echarts.min.js"></script>
    <script src="./js/setAxisSca.js"></script>
    <script src="./js/functions.js"></script>
    <script src="lib/font.js" crossorigin="anonymous"></script>
    <link rel="shortcut icon" href="img/icons/title-nxp.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/sca.css">
    <link rel="stylesheet" href="css/nav.css">
    <style>
        body {
            background-image: url(./img/pictures/wifi.jpg);
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: cover;
        }
    </style>

    <title>Secure Car Access</title>

</head>

<body>
    <div id="header">
        <div id="return_button">
            <img src="img/icons/back.png" style="height: 30px; margin: 10px 0px;"  onclick="window.history.back()"/>
        </div>
        <div id="start_button">
            <img src="img/pictures/start.png" style="height: 30px; margin: 10px 30px;"  onclick="start_sca()"/>
        </div>
        <div id="reset_button">
            <img src="img/pictures/reset.png" style="height: 30px; margin: 10px 0px;"  onclick="reset_sca()"/>
        </div>
        <div class="nav_container">
            <input type="checkbox" name="" id="check">
            <div class="nav-btn">
                <div class="nav-links">
                    <ul>
                        <li class="nav-link" style="--i: .6s">
                            <a href="./index.html">Home</a>
                        </li>
                        <li class="nav-link" style="--i: .85s">
                            <a href="./wifi.html">WIFI</a>
                        </li>
                        <li class="nav-link" style="--i: 1.1s">
                            <a href="./bt.html">Bluetooth</a>
                        </li>
                        <li class="nav-link" style="--i: 1.35s">
                            <a href="./terminal.html">Terminal</a>
                        </li>
                        <li class="nav-link" style="--i: 1.35s">
                            <a href="./gnss.html">GNSS</a>
                        </li>
                        <li class="nav-link" style="--i: 1.35s">
                            <a href="./quantum.html">Quantum</a>
                        </li>
                    </ul>
                </div>
            </div>

            <div class="hamburger-menu-container">
                <div class="hamburger-menu">
                    <div></div>
                </div>
            </div>
        </div>
    </div>
    <div id="board-name">
        <p>Secure Car Access</p>
    </div>
    <div class="charts-container">
        <div id="boxup" class="box-sca">
            <div id="sca-car" class="box-sca" ><img src="img/pictures/car.png" style="height: 10vh; width: 24vh; "/></div>
            <div id="dot"></div>
        </div>
        <div class="box-sca">
            <div id="boxdown" class="box-sca">
                <div id="chart-distance" class="chart"></div>
            </div>
            <div id="boxRssi" class="box-sca">
                <div id="chart-rssi" class="chart"></div>
            </div>
        </div>
    </div>

    <script>

        var myChart_distance = echarts.init(document.getElementById('chart-distance'), null, {
            renderer: 'canvas',
            useDirtyRect: false
        });
        var xtime = new Array();
        var option_distance = {
            color: '#fcb316',
            backgroundColor: 'rgba(0,0,0,0)',
            tooltip: {
                trigger: 'axis'
            },
            calculable: true,
            xAxis: [{
                type: 'category',
                boundaryGap: false,
                axisLine: {
                    lineStyle: {
                        type: 'solid',
                        color: '#000000',
                        width: '4'
                    }
                },
                axisLabel: {
                    textStyle: {
                        color: '#000000'
                    }
                },
                spiltLine: {
                    show: true,
                    lineStyle: {
                        color: ['#000000']
                    }
                },
                data: xtime
            }],

            yAxis: [{
                type: 'value',
                name: 'DISTANCE',
                max: 3,
                min: 0,
                axisLabel: {
                    formatter: '{value}',
                    textStyle: {
                        color: '#000000'
                    }
                },
                axisLine: {
                    lineStyle: {
                        type: 'solid',
                        color: '#000000',
                        width: '4'
                    }
                },
                spiltLine: {
                    show: true,
                    lineStyle: {
                        color: ['#000000']
                    }
                }
            }],
            grid: {
                top: '15%',
                bottom: '15%',
                left: '15%'
            },
        };

        myChart_distance.setOption(option_distance);
        window.addEventListener('resize', myChart_distance.resize);
        //////////////////////////////////////////////////////////////
        var myChart_rssi = echarts.init(document.getElementById('chart-rssi'), null, {
            renderer: 'canvas',
            useDirtyRect: false
        });

        //define chart's option
        var option_rssi = {
            color: '#fcb316',
            backgroundColor: 'rgba(0,0,0,0)',
            tooltip: {
                trigger: 'axis'
            },
            calculable: true,
            xAxis: [{
                type: 'category',
                boundaryGap: false,
                axisLine: {
                    lineStyle: {
                        type: 'solid',
                        color: '#000000',
                        width: '4'
                    }
                },
                axisLabel: {
                    textStyle: {
                        color: '#000000'
                    }
                },
                spiltLine: {
                    show: true,
                    lineStyle: {
                        color: ['#000000']
                    }
                },
                data: xtime
            }],
            yAxis: [{
                type: 'value',
                name: 'RSSI/dBm',
                max: 0,
                min: -100,
                axisLabel: {
                    formatter: '{value}',
                    textStyle: {
                        color: '#000000'
                    }
                },
                axisLine: {
                    lineStyle: {
                        type: 'solid',
                        color: '#000000',
                        width: '4'
                    }
                },
                spiltLine: {
                    show: true,
                    lineStyle: {
                        color: ['#000000']
                    }
                }
            }],
            grid: {
                top: '15%',
                bottom: '15%',
                left: '15%'
            },
        };

        myChart_rssi.setOption(option_rssi);
        window.addEventListener('resize', myChart_rssi.resize);
    </script>
</body>
</html>
