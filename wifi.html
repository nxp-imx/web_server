<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1,maximum-scale=1,user-scalable=no">
    <script src="./lib/jquery-3.7.0.js"></script>
    <script src="./js/functions.js"></script>
    <link rel="stylesheet" href="./css/wifi.css" />
    <link rel="stylesheet" href="css/nav.css">
    <link rel="shortcut icon" href="img/icons/title-nxp.ico" type="image/x-icon">
    <title>WIFI Connector</title>

    <style>
        body {
            background-image: url(./img/pictures/wifi.jpg);
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: cover;
        }
    </style>

    <style media="screen">
        .loading {
            position: relative;
            top: 28px;
            width: 40px;
            perspective: 200px;
            display: inline-block;
            visibility: hidden;
        }
        
        .loading:before,
        .loading:after {
            position: absolute;
            width: 15px;
            height: 15px;
            content: "";
            animation: jumping 0.5s infinite alternate;
            background: rgba(255, 255, 255, 0);
        }
        
        .loading:before {
            left: 0;
        }
        
        .loading:after {
            right: 0;
            animation-delay: 0.15s;
        }
        
        @keyframes jumping {
            0% {
                transform: scale(1) translateY(0px) rotateX(0deg);
                box-shadow: 0 0 0 rgba(255, 255, 255, 0);
            }
            100% {
                transform: scale(1.2) translateY(-25px) rotateX(45deg);
                background: #ffffff;
                box-shadow: 0 25px 40px #ffffff;
            }
        }
    </style>
</head>
<!-- =============================================================================================== -->

<body>
    <div id="header">
        <div id="return_button">
            <img src="img/icons/back.png" style="height: 25px; margin: 10px 0px;"  onclick="window.history.back()"/>
        </div>
        <div id="nxp_logo">
            <img src="./img/icons/nxp_logo.png" style="height: 48px;" />
        </div>
        <div class="nav_container">
            <input type="checkbox" name="" id="check">
            <div class="nav-btn">
                <div class="nav-links">
                    <ul>
                        <li class="nav-link" style="--i: .6s">
                            <a href="./index.html">Home</a>
                        </li>
                        <li class="nav-link" style="--i: 1.1s">
                            <a href="./bt.html">Bluetooth</a>
                        </li>
                        <li class="nav-link" style="--i: 1.35s">
                            <a href="./info.html">Board Information</a>
                        </li>
                        <li class="nav-link" style="--i: 1.35s">
                            <a href="./terminal.html">Terminal</a>
                        </li>
                        <li class="nav-link" style="--i: 1.35s">
                            <a href="./gnss.html">GNSS</a>
                        </li>
                        <li class="nav-link" style="--i: 1.35s">
                            <a href="./sca.html">SCA</a>
                        </li>
                        <li class="nav-link" style="--i: 1.35s">
                            <a href="./quantum.html">Quantum</a>
                        </li>
                    </ul>
                </div>
            </div>

            <div class="hamburger-menu-container">
                <div class="hamburger-menu">
                    <div></div>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <form class="login-form">
            <div>
                <a id="wifiicon" class="icon-wifi iconfont" style=" color:aliceblue;"></a>
            </div>
            <h2 style=" color:aliceblue;font-weight:bold; ">WIFI Connector</h2>
            <select id="select_wifi_name">
                <option>choose your wifi</option>
            </select>
            <input id="wifipwd" type="password" placeholder="password">
            <p>
                <span><button type="button"  value="scan" onclick="scan_wifi() " style="color:aliceblue;font-weight:bold; width:100px;padding:0  ">scan</button></span>
                <span><button type="button"  id='connect_button' value="Connect" style="color:aliceblue;font-weight:bold;">connect</button></span>
            </p>
            <div class="loading" id="loading" style="align-self: center;"> </div>
        </form>
    </div>
    <!-- =============================================================================================== -->
    <script>

        document.getElementById('connect_button').addEventListener('click', () => {
            var select_wifi = document.getElementById('select_wifi_name').children[Number(document.getElementById('select_wifi_name').value)+1];
            var passwd = document.getElementById('wifipwd').value;
            var status = 0;

            if(select_wifi == undefined){
                status = 1;
                alert('Please select the WiFi');
            }else if(passwd == ''){
                status = 2;
                alert('Please input the password');
            }

            if(status == 0){
                connect_wifi(select_wifi.innerText,passwd)
            }
        });


        function scan_wifi() {
            $(loading).css("visibility", "visible");
            $.ajax({
                type: "GET",
                url: "./php/wifi_manager.php?action=scan",
                async: true,
                dataType: "json",
                success: function(data) {
                    /*get raw_info*/
                    var wifi_info_string = data; 

                    var wifi_list = proc_wifi_data(wifi_info_string);
                    document.getElementById("select_wifi_name").length = 1;
                    let com = document.getElementById("select_wifi_name");
                    for (let i = 0; i < wifi_list.length; i++) {
                        com.options.add(new Option(wifi_list[i], i));
                    }
                    document.getElementById('wifipwd').value = '';
                    /* Display over*/
                    $(loading).css("visibility", "hidden"); 
                }
            });
        }

        function proc_wifi_data(wifi_info_string) {
            var wifi_info_proc = []; 
            var index;
            var wifi_info_list = [];
            var ssid_name;
            wifi_info_proc.splice(0); 

            for (var i = 0; i < wifi_info_string.length; i++) {
                wifi_info_proc.push(wifi_info_string[i].trim());
            }

            for (var i = wifi_info_proc.length - 1; i >= 0; i--) {
                index = wifi_info_proc[i].indexOf('SSID:');
                if (index != -1) {
                    ssid_name = wifi_info_proc[i].split(':')[wifi_info_proc[i].split(':').length-1].trim();
                    if((!wifi_info_list.includes(ssid_name))&&(!ssid_name.includes('NULLNULL'))&&(!ssid_name.includes('\x00\x00'))){
                        wifi_info_list.push(ssid_name);
                    }
                }
            }
            return wifi_info_list;
        }

        function connect_wifi(ssid, pwd) {
        var i = 0;
        var connect_status = 0;
        var current_ssid = "";
        $(loading).css("visibility", "visible");

        // Step 1: check current connect status
        $.ajax({
            type: "GET",
            url: "./php/wifi_manager.php?action=status",
            async: true,
            dataType: "json",
            success: function(data) {
                console.log("Current status:", data);
                // connected?
                if (data.status === "ok" && data.connected && data.ssid) {
                    connect_status = 1;
                    current_ssid = data.ssid;
                    console.log("Currently connected to:", current_ssid);
                } else {
                    connect_status = 0;
                    console.log("Not connected");
                }
                // Step 2: whether need to connect
                if (connect_status == 1 && current_ssid === ssid) {
                    alert('Already connected to ' + ssid + '!');
                    $(loading).css("visibility", "hidden");
                    console.log("Already connected to target network, skip connection");
                } else if (connect_status == 1 && current_ssid !== ssid) {
                    console.log("Connected to different network, disconnecting first...");
                    // Step 3: disconnect current AP
                    $.ajax({
                        type: "GET",
                        url: "./php/wifi_manager.php?action=disconnect",
                        async: true,
                        dataType: "json",
                        success: function(disconnect_data) {
                            console.log("Disconnect result:", disconnect_data);
                            if (disconnect_data.status === "ok") {
                                console.log("Disconnected successfully, now connecting to new network...");
                                setTimeout(function() {
                                    connectToNewNetwork(ssid, pwd);
                                }, 2000);
                            } else {
                                alert('Failed to disconnect from current network!');
                                $(loading).css("visibility", "hidden");
                            }
                        },
                        error: function(xhr, status, error) {
                            console.error("Disconnect error:", error);
                            alert('Disconnect error: ' + error);
                            $(loading).css("visibility", "hidden");
                        }
                    });
                } else {
                    console.log("Not connected, connecting to new network...");
                    connectToNewNetwork(ssid, pwd);
                }
            },
            error: function(xhr, status, error) {
                console.error("Status check error:", error);
                console.log("Status check failed, trying to connect anyway...");
                connectToNewNetwork(ssid, pwd);
            }
        });
        // connect to new network
        function connectToNewNetwork(ssid, pwd) {
            $.ajax({
                type: "GET",
                url: "./php/wifi_manager.php?action=connect",
                async: true,
                dataType: "json",
                data: {
                    wifi_name: ssid,
                    wifi_pwd: pwd
                },
                timeout: 15000,
                success: function(data) {
                    console.log("Connect result:", data);
                    if (data.status === "ok") {
                        alert('Connecting to ' + ssid + '...\nPlease wait a moment and check the connection status.');
                    } else {
                        alert('Connection failed: ' + (data.msg || data.step));
                    }
                    $(loading).css("visibility", "hidden");
                },
                error: function(xhr, status, error) {
                    console.error("Connect error:", error);
                    if (status === 'timeout') {
                        alert('Connection timeout!\nPlease check the IP address of mlan0 on OB2\nIf connect failed, scan and connect again!');
                    } else {
                        alert('Connection error: ' + error);
                    }
                    $(loading).css("visibility", "hidden");
                },
                complete: function(XHR, TextStatus) {
                    if (TextStatus == 'timeout') {
                        alert('Please check the IP address of mlan0 on OB2\nIf connect failed, scan and connect again!');
                        $(loading).css("visibility", "hidden");
                    }
                }
            });
        }
    }
    </script>

</body>

</html>
