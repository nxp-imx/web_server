<!DOCTYPE html>
<html>

<head>
    <meta charset='UTF-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1,maximum-scale=1,user-scalable=no">
    <script src="./lib/jquery-3.7.0.js"></script>
    <script src="./js/functions.js"></script>
    <link rel="stylesheet" href="./css/terminal.css" />
    <link rel="stylesheet" href="css/nav.css">
    <link rel="shortcut icon" href="img/icons/title-nxp.ico" type="image/x-icon">
    <title>Terminal</title>
    <style>
        body {
            background-image: url(./img/pictures/wifi.jpg);
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: cover;
            overflow: hidden;
        }
    </style>


</head>

<body>
    <div id="header">
        <div id="return_button">
            <img src="img/icons/back.png" style="height: 25px; margin: 10px 0px;"  onclick="window.history.back()"/>
        </div>

        <div id="nxp_logo">
            <img src="./img/icons/nxp_logo.png" style="height: 48px;" />
        </div>
        <div class="nav_container">
            <input type="checkbox" name="" id="check">
            <div class="nav-btn">
                <div class="nav-links">
                    <ul>
                        <li class="nav-link" style="--i: .6s">
                            <a href="./index.html">Home</a>
                        </li>
                        <li class="nav-link" style="--i: .85s">
                            <a href="./wifi.html">WIFI</a>
                        </li>
                        <li class="nav-link" style="--i: 1.1s">
                            <a href="./bt.html">Bluetooth</a>
                        </li>
                        <li class="nav-link" style="--i: 1.35s">
                            <a href="./info.html">Board Information</a>
                        </li>
                        <li class="nav-link" style="--i: 1.35s">
                            <a href="./gnss.html">GNSS</a>
                        </li>
                        <li class="nav-link" style="--i: 1.35s">
                            <a href="./sca.html">SCA</a>
                        </li>
                        <li class="nav-link" style="--i: 1.35s">
                            <a href="./quantum.html">Quantum</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="hamburger-menu-container">
            <div class="hamburger-menu">
                <div></div>
            </div>
        </div>
    </div>
    <div id="container">
        <div id="text-area">
            <div id="title">
                <p>Terminal</p>
            </div>
            <div>
                <input type="text" id="command_input" onkeydown="if(event.keyCode==13) terminal(document.getElementById('command_input').value);">
                <span><button id="send_button" onclick="terminal(document.getElementById('command_input').value)">send</button></span>
            </div>
            <div>
                <textarea name="" id="output" cols="30" rows="10" readonly></textarea>
            </div>
        </div>

    </div>


    <script>
        var currentCwd = "";

        // Reset session cwd to /root on page load, then fetch initial cwd
        $.ajax({
            type: "GET",
            url: "./php/terminal.php?reset=1&command=" + encodeURIComponent("pwd"),
            async: false,
            dataType: "json",
            success: function(data) {
                if (data.cwd !== undefined) currentCwd = data.cwd;
            }
        });

        function getPrompt() {
            var home = "/root";
            var dir = currentCwd;
            if (dir.indexOf(home) === 0) {
                dir = "~" + dir.substring(home.length);
            }
            return dir + "$ ";
        }

        function terminal(command) {
            document.getElementById("command_input").value = ''; //clear input

            var prompt = getPrompt();
            $.ajax({
                type: "GET",
                url: "./php/terminal.php?command=" + encodeURIComponent(command),
                async: true,
                dataType: "json",
                success: function(data) {
                    var out = document.getElementById("output");
                    if (data.clear === true) {
                        out.value = "";
                    } else {
                        out.value += prompt + command + "\r\n";
                        var lines = data.output !== undefined ? data.output : data;
                        for(var i=0;i< lines.length;i++)
                        {
                            out.value += lines[i] + "\r\n";
                        }
                    }
                    if (data.cwd !== undefined) currentCwd = data.cwd;
                    out.scrollTop = out.scrollHeight;
                }
            });
        }
    </script>
</body>

</html>

</html>
