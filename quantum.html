<!DOCTYPE html>
<html>

<head>
    <meta charset='UTF-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1,maximum-scale=1,user-scalable=no">
    <script src="./lib/jquery-3.7.0.js"></script>
    <script src="./lib/echarts.min.js"></script>
    <script src="./js/functions.js"></script>
    <script src="lib/font.js" crossorigin="anonymous"></script>
    <link rel="shortcut icon" href="img/icons/title-nxp.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/info.css">
    <link rel="stylesheet" href="css/nav.css">
    <link rel="stylesheet" href="css/quantum.css">
    <style>
        .disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>

    <title>Quantum Radio</title>

</head>

<body>
    <div id="header">
        <div id="return_button">
            <img src="img/icons/back.png" style="height: 25px; margin: 10px 0px;" onclick="window.history.back()" />
        </div>
        <div id="nxp_logo">
            <img src="img/icons/nxp_logo.png" style="height: 48px;" />
        </div>
        <div class="nav_container">
            <input type="checkbox" name="" id="check">
            <div class="nav-btn">
                <div class="nav-links">
                    <ul>
                        <li class="nav-link" style="--i: .6s">
                            <a href="./index.html">Home</a>
                        </li>
                        <li class="nav-link" style="--i: .85s">
                            <a href="./wifi.html">WIFI</a>
                        </li>
                        <li class="nav-link" style="--i: 1.1s">
                            <a href="./bt.html">Bluetooth</a>
                        </li>
                        <li class="nav-link" style="--i: 1.35s">
                            <a href="./info.html">Board Information</a>
                        </li>
                        <li class="nav-link" style="--i: 1.35s">
                            <a href="./terminal.html">Terminal</a>
                        </li>
                    </ul>
                </div>
            </div>

            <div class="hamburger-menu-container">
                <div class="hamburger-menu">
                    <div></div>
                </div>
            </div>
        </div>
    </div>
    <div id="board-name">
        <p>OrangeBox</p>
        <p id="board-name-line2">Quantum Radio</p>
    </div>
    <div class="radio-controls">
        <button id="startBtn" class="radio-btn">Start</button>
        <button id="stopBtn" class="radio-btn stop">Stop</button>
        <button id="resetBtn" class="radio-btn reset">Reset</button>
    </div>
    
    <div class="current-station">
        Current Station: <span id="currentStation">None</span>
    </div>
    
    <div class="charts-container">
        <div id="stations-box" class="box">
            <div class="box-title">Available Stations</div>
            <div id="stationList" class="station-list">
                <!-- Stations will be populated here -->
            </div>
        </div>
    </div>

    <script>
        // Radio status
        var radioStatus = "stopped";
        var currentStation = null;
        var stations = [];
        // timer ID
        var stationListInterval = null;

        // Disable stop and reset buttons immediately
        $('#stopBtn').prop('disabled', true);
        $('#stopBtn').addClass('disabled');
        
        // Start radio
        $('#startBtn').click(function() {
            
            $.ajax({
                type: "GET",
                url: "./php/radio.php?action=start",
                async: true,
                dataType: "json",
                success: function(data) {
                    radioStatus = "running";
                    // Disable start button after successful start
                    $('#startBtn').prop('disabled', true);
                    $('#startBtn').addClass('disabled');
                    $('#stopBtn').prop('disabled', false);
                    $('#stopBtn').removeClass('disabled');
                    if (data['status'] == 'OK') {
                        alert("Quantum started!");
                        // Initialize radio
                        updateStationList();
                        stationListInterval = setInterval(updateStationList, 5000); // Update station list every 5 seconds
                    } else
                        alert("Qauntum started failed.");
                    console.log(data);
                },
                error: function() {
                    
                }
            });
        });
        
        // Stop radio
        $('#stopBtn').click(function() {
            $.ajax({
                type: "GET",
                url: "./php/radio.php?action=stop",
                async: true,
                dataType: "json",
                success: function(data) {
                    radioStatus = "stopped";
                    currentStation = null;
                    $('#currentStation').text("None");
                    $('.station-item').removeClass('active');
                    // Clear timer
                    if (stationListInterval) {
                        clearInterval(stationListInterval);
                        stationListInterval = null;
                    }
                    console.log(data);
                }
            });
        });
        
        // Reset radio
        $('#resetBtn').click(function() {
            $.ajax({
                type: "GET",
                url: "./php/radio.php?action=reset",
                async: true,
                dataType: "json",
                success: function(data) {
                    radioStatus = "stopped";
                    currentStation = null;
                    $('#currentStation').text("None");
                    $('.station-item').removeClass('active');
                    // Re-enable start button after reset
                    $('#startBtn').prop('disabled', false);
                    $('#startBtn').removeClass('disabled');
                    $('#stopBtn').prop('disabled', true);
                    $('#stopBtn').addClass('disabled');
                    // Clear timer
                    if (stationListInterval) {
                        clearInterval(stationListInterval);
                        stationListInterval = null;
                    }
                    if (data['status'] == 'OK')
                        alert("Quantum Reset over.");
                    else
                        alert("Quantum Reset error.");
                    console.log(data);
                }
            });
        });
        
        // Update station list
        function updateStationList() {
            // In a real implementation, this would fetch from a PHP script
            // that interacts with a radio service
            $.ajax({
                type: "GET",
                url: "./php/radio.php?action=list",
                async: true,
                dataType: "json",
                success: function(data) {
                    stations = parseStations(data);
                    renderStationList();
                }
            });
        }
        
        // Parse station data
        function parseStations(data) {
            // This is a placeholder - in a real implementation, 
            // you would parse actual data from the radio service
            if (data && data.station_list && data.station_list.length > 0) {
                // Parse the station_list from the provided format
                return data.station_list.map((item, index) => {
                    // Keep the original frequency value
                    return {
                        id: index,
                        name: `Station ${index + 1}`,
                        frequency: item.frequency, // Keep original frequency value
                        quality: item.quality
                    };
                });
            }
            
            // Default stations for demonstration
            return [
                { id: 1, name: "NXP FM Radio", frequency: 98500000 },
                { id: 2, name: "Quantum Hits", frequency: 102700000 },
                { id: 3, name: "Classic Rock", frequency: 105300000 },
                { id: 4, name: "News Network", frequency: 108900000 },
                { id: 5, name: "Jazz Lounge", frequency: 88100000 },
                { id: 6, name: "ABC", frequency: 88600000 },
                { id: 7, name: "DEF", frequency: 88900000 },
            ];
        }
        
        // Render station list
        function renderStationList() {
            var listHtml = '';
            stations.forEach(function(station) {
                var activeClass = (currentStation && currentStation.id === station.id) ? 'active' : '';
                listHtml += `<div class="station-item ${activeClass}" data-id="${station.id}">`;
                listHtml += `<div class="station-info">`;
                // Convert frequency to MHz for display
                const frequencyMHz = (station.frequency / 1000000).toFixed(1) + " MHz";
                listHtml += `<strong>${station.name}</strong> - ${frequencyMHz}`;
                listHtml += `</div>`;
                listHtml += `<div class="station-quality">`;
                listHtml += `Quality: ${station.quality || 'N/A'}`;
                listHtml += `</div>`;
                listHtml += `</div>`;
            });
            
            $('#stationList').html(listHtml);
            
            // Add click handlers to station items
            $('.station-item').click(function() {
                var stationId = $(this).data('id');
                selectStation(stationId);
            });
        }
        
        // Select a station
        function selectStation(stationId) {
            var station = stations.find(s => s.id == stationId);
            if (station) {
                currentStation = station;
                // Convert frequency to MHz for display
                const frequencyMHz = (station.frequency / 1000000).toFixed(1) + " MHz";
                $('#currentStation').text(station.name + " (" + frequencyMHz + ")");
                $('.station-item').removeClass('active');
                $(`.station-item[data-id="${stationId}"]`).addClass('active');
                
                // Send command to tune to the station (using original frequency value)
                $.ajax({
                    type: "GET",
                    url: "./php/radio.php?tune=" + station.frequency,
                    async: true,
                    dataType: "json",
                    success: function(data) {
                        console.log("Tuned to station: " + station.frequency);
                    }
                });
            }
        }
    </script>
</body>

</html>
